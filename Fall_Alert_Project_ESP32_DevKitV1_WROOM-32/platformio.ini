; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Tốc độ Serial Monitor
monitor_speed = 115200
upload_speed = 921600

; Tự động tải các thư viện cần thiết
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

; Sửa lỗi thiếu file thư viện DSP của Edge Impulse trên PlatformIO & tắt cảnh báo rác từ thư viện bên thứ 3
build_flags =
    -DEIDSP_USE_ESP_DSP=0
    -Wno-deprecated-declarations
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-parentheses
    -Ilib/Wearable-Fall-Detection_inferencing/src
    -Ilib/Wearable-Fall-Detection_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/fft/include
    -Ilib/Wearable-Fall-Detection_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/common/include
