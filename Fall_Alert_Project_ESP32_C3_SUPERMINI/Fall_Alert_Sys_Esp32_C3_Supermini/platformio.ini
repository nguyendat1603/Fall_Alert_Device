; PlatformIO Project Configuration File
; ESP32-C3 SuperMini Fall Alert System

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Tự động tải các thư viện cảm biến cần thiết
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4

; Cờ biên dịch: USB CDC qua Type-C của ESP32-C3, tắt ESP-DSP (dùng code chuẩn C3 RISC-V) và tắt các cảnh báo không cần thiết
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DEIDSP_USE_ESP_DSP=0
    -DEI_PORTING_ARDUINO=1
    -Wno-deprecated-declarations
    -Wno-unused-variable
    -Wno-unused-function
    -Wno-parentheses
    -Ilib/wearable_fall_inferencing/src
    -Ilib/wearable_fall_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/fft/include
    -Ilib/wearable_fall_inferencing/src/edge-impulse-sdk/porting/espressif/esp-dsp/modules/common/include
